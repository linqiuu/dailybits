x-database-env: &database-env
  POSTGRES_DB: "${POSTGRES_DB:-dailybits}"
  POSTGRES_USER: "${POSTGRES_USER:-postgres}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      <<: *database-env
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - "${DAILYBITS_ENV_FILE:-.env}"
    environment:
      <<: *database-env
      DOCKER_DATABASE_URL: "${DOCKER_DATABASE_URL:-}"
      NODE_ENV: production
      APP_ENV: production
      TZ: "${TZ:-Asia/Shanghai}"
    command: ["node", "scripts/container-start.mjs", "migrate"]

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - "${DAILYBITS_ENV_FILE:-.env}"
    environment:
      <<: *database-env
      DOCKER_DATABASE_URL: "${DOCKER_DATABASE_URL:-}"
      AUTH_MODE: gateway
      NODE_ENV: production
      APP_ENV: production
      TZ: "${TZ:-Asia/Shanghai}"
      SCHEDULER_TIMEZONE: "${SCHEDULER_TIMEZONE:-Asia/Shanghai}"
      NEXT_TELEMETRY_DISABLED: "1"
    command: ["node", "scripts/container-start.mjs", "web"]
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - "${DAILYBITS_ENV_FILE:-.env}"
    environment:
      <<: *database-env
      DOCKER_DATABASE_URL: "${DOCKER_DATABASE_URL:-}"
      NODE_ENV: production
      APP_ENV: production
      TZ: "${TZ:-Asia/Shanghai}"
      SCHEDULER_TIMEZONE: "${SCHEDULER_TIMEZONE:-Asia/Shanghai}"
      HOLIDAY_COUNTRY: "${HOLIDAY_COUNTRY:-CN}"
      SKIP_NON_WORKING_DAYS: "${SKIP_NON_WORKING_DAYS:-true}"
      NEXT_TELEMETRY_DISABLED: "1"
    command: ["node", "scripts/container-start.mjs", "scheduler"]

volumes:
  postgres_data:
