x-app-build: &app-build
  context: .
  args:
    BASE_IMAGE: "${BASE_IMAGE:-node:22-bookworm-slim}"
    APT_MIRROR: "${APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}"
    APT_SECURITY_MIRROR: "${APT_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}"
    NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
    PRISMA_ENGINES_MIRROR: "${PRISMA_ENGINES_MIRROR:-https://binaries.prisma.sh}"
    HTTP_PROXY: "${BUILD_HTTP_PROXY:-}"
    HTTPS_PROXY: "${BUILD_HTTPS_PROXY:-${BUILD_HTTP_PROXY:-}}"
    NO_PROXY: "${BUILD_NO_PROXY:-}"

x-database-env: &database-env
  POSTGRES_DB: "${POSTGRES_DB:-dailybits}"
  POSTGRES_USER: "${POSTGRES_USER:-postgres}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

services:
  db:
    image: "${POSTGRES_IMAGE:-postgres:16-bookworm}"
    restart: unless-stopped
    environment:
      <<: *database-env
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: "${DAILYBITS_IMAGE:-dailybits:local}"
    build: *app-build
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - "${DAILYBITS_ENV_FILE:-.env}"
    environment:
      <<: *database-env
      DOCKER_DATABASE_URL: "${DOCKER_DATABASE_URL:-}"
      NODE_ENV: production
      APP_ENV: production
      TZ: "${TZ:-Asia/Shanghai}"
    command: ["node", "scripts/container-start.mjs", "migrate"]

  app:
    image: "${DAILYBITS_IMAGE:-dailybits:local}"
    build: *app-build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - "${DAILYBITS_ENV_FILE:-.env}"
    environment:
      <<: *database-env
      DOCKER_DATABASE_URL: "${DOCKER_DATABASE_URL:-}"
      AUTH_MODE: gateway
      NODE_ENV: production
      APP_ENV: production
      TZ: "${TZ:-Asia/Shanghai}"
      SCHEDULER_TIMEZONE: "${SCHEDULER_TIMEZONE:-Asia/Shanghai}"
      NEXT_TELEMETRY_DISABLED: "1"
    command: ["node", "scripts/container-start.mjs", "web"]
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    image: "${DAILYBITS_IMAGE:-dailybits:local}"
    build: *app-build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - "${DAILYBITS_ENV_FILE:-.env}"
    environment:
      <<: *database-env
      DOCKER_DATABASE_URL: "${DOCKER_DATABASE_URL:-}"
      NODE_ENV: production
      APP_ENV: production
      TZ: "${TZ:-Asia/Shanghai}"
      SCHEDULER_TIMEZONE: "${SCHEDULER_TIMEZONE:-Asia/Shanghai}"
      HOLIDAY_COUNTRY: "${HOLIDAY_COUNTRY:-CN}"
      SKIP_NON_WORKING_DAYS: "${SKIP_NON_WORKING_DAYS:-true}"
      NEXT_TELEMETRY_DISABLED: "1"
    command: ["node", "scripts/container-start.mjs", "scheduler"]

volumes:
  postgres_data:
